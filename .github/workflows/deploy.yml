name: Deploy to Cloud Run

# A release only ever comes from a green build: the verify job below is the CI
# workflow itself, and deploy depends on it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Required for Workload Identity Federation — GitHub mints a short-lived OIDC token
  # and GCP exchanges it. No long-lived service-account key exists anywhere.
  id-token: write

env:
  # Overridable per-environment via repository variables; defaults match the project
  # this was built for.
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'roxstar-backend' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
  ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY || 'roxstar' }}
  SERVICE_NAME: ${{ vars.SERVICE_NAME || 'roxstar-backend' }}
  SECRET_NAME: ${{ vars.MONGODB_SECRET_NAME || 'roxstar-mongodb-uri' }}

jobs:
  verify:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build, push and deploy
    needs: verify
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up the gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # Captured BEFORE the deploy so the rollback step has somewhere to go back to.
      - name: Record the currently serving revision
        id: current
        run: |
          REVISION=$(gcloud run services describe "$SERVICE_NAME" \
            --region "$GCP_REGION" \
            --format='value(status.traffic[0].revisionName)' 2>/dev/null || echo "")
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "Currently serving: ${REVISION:-<none, first deploy>}"

      - name: Build and push the image
        id: image
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/${SERVICE_NAME}"
          # Tagged with the commit SHA for traceability, plus latest for convenience.
          docker build --build-arg GIT_SHA="${GITHUB_SHA}" \
            -t "${IMAGE}:${GITHUB_SHA}" \
            -t "${IMAGE}:latest" \
            ./backend
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          echo "ref=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # max-instances=1 is a hard requirement, not tuning: presence tracking, spin
      # timers and the per-room mutex are in-process, so a second instance would split
      # that state. session-affinity and the long timeout keep WebSockets stable.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --image "${{ steps.image.outputs.ref }}" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --min-instances 1 \
            --max-instances 1 \
            --session-affinity \
            --timeout 3600 \
            --cpu 1 --memory 512Mi \
            --set-env-vars "NODE_ENV=production,LOG_LEVEL=info,SPIN_ELIMINATION_INTERVAL_MS=5000" \
            --set-secrets "MONGODB_URI=${SECRET_NAME}:latest" \
            --revision-suffix "${GITHUB_SHA::7}" \
            --quiet

      - name: Resolve the service URL
        id: url
        run: |
          URL=$(gcloud run services describe "$SERVICE_NAME" \
            --region "$GCP_REGION" --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $URL"

      - name: Install smoke-test dependencies
        working-directory: backend
        run: npm ci

      # The release gate: liveness, database readiness and a real WebSocket upgrade
      # through the Cloud Run ingress.
      - name: Smoke test the deployment
        id: smoke
        working-directory: backend
        run: node scripts/smoke.mjs "${{ steps.url.outputs.url }}"

      # Only reachable when the smoke test failed and a previous revision exists.
      - name: Roll back to the previous revision
        if: failure() && steps.current.outputs.revision != ''
        run: |
          echo "Smoke test failed — restoring ${{ steps.current.outputs.revision }}"
          gcloud run services update-traffic "$SERVICE_NAME" \
            --region "$GCP_REGION" \
            --to-revisions "${{ steps.current.outputs.revision }}=100" \
            --quiet
          echo "Traffic restored. The bad revision remains for inspection."

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### Cloud Run deployment"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Service | \`$SERVICE_NAME\` |"
            echo "| Region | \`$GCP_REGION\` |"
            echo "| Image | \`${{ steps.image.outputs.ref }}\` |"
            echo "| URL | ${{ steps.url.outputs.url }} |"
            echo "| Previous revision | \`${{ steps.current.outputs.revision }}\` |"
            echo "| Smoke test | ${{ steps.smoke.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
