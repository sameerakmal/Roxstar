name: Deploy to Azure Container Apps

# A release only ever comes from a green build: the verify job below is the CI
# workflow itself, and deploy depends on it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Required for OIDC — GitHub mints a short-lived token that Entra exchanges for an
  # Azure access token. No Azure client secret exists anywhere.
  id-token: write

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'roxstar-backend-rg' }}
  AZURE_REGION: ${{ vars.AZURE_REGION || 'centralindia' }}
  CONTAINERAPP_NAME: ${{ vars.CONTAINERAPP_NAME || 'roxstar-backend' }}
  ACR_NAME: ${{ vars.ACR_NAME }}
  IMAGE_NAME: roxstar-backend

jobs:
  verify:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build, push and deploy
    needs: verify
    runs-on: ubuntu-latest
    # The federated credential for this job carries the subject
    # repo:<org>/<repo>:environment:production — the setup script registers it.
    environment: production

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Fail fast if the registry is not configured
        run: |
          if [[ -z "${ACR_NAME}" ]]; then
            echo "Repository variable ACR_NAME is not set. Registry names are globally"
            echo "unique, so there is no safe default. See docs/deployment.md."
            exit 1
          fi

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve registry
        id: registry
        run: |
          LOGIN_SERVER=$(az acr show --name "${ACR_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" --query loginServer -o tsv)
          echo "login_server=${LOGIN_SERVER}" >> "$GITHUB_OUTPUT"
          echo "image=${LOGIN_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # Captured BEFORE the deploy so rollback has a concrete target. Empty on the very
      # first deploy, when the app still runs the bootstrap image.
      - name: Record the currently deployed image
        id: current
        run: |
          PREVIOUS=$(az containerapp show --name "${CONTAINERAPP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || echo "")
          echo "image=${PREVIOUS}" >> "$GITHUB_OUTPUT"
          echo "Currently deployed: ${PREVIOUS:-<none>}"

      # Built once, tagged twice locally. Only the immutable commit-addressed tag is
      # pushed here; :latest is held back until every deployment gate has passed so a
      # failed build can never end up behind it.
      - name: Build and push the immutable image
        run: |
          az acr login --name "${ACR_NAME}"
          docker build --build-arg GIT_SHA="${GITHUB_SHA}" \
            -t "${{ steps.registry.outputs.image }}" \
            -t "${{ steps.registry.outputs.login_server }}/${IMAGE_NAME}:latest" \
            ./backend
          docker push "${{ steps.registry.outputs.image }}"

      # Only the image changes. Ingress, probes, secrets and the replica pinning come
      # from the spec applied at setup time and are preserved by an image-only update.
      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name "${CONTAINERAPP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --image "${{ steps.registry.outputs.image }}" \
            --output none

      # The single-replica rule is a correctness requirement, so it is asserted rather
      # than assumed: in-process presence, spin timers and the room mutex cannot be
      # split across replicas.
      - name: Verify the replica configuration is still 1/1
        run: |
          MIN=$(az containerapp show --name "${CONTAINERAPP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query "properties.template.scale.minReplicas" -o tsv)
          MAX=$(az containerapp show --name "${CONTAINERAPP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query "properties.template.scale.maxReplicas" -o tsv)
          MODE=$(az containerapp show --name "${CONTAINERAPP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query "properties.configuration.activeRevisionsMode" -o tsv)
          echo "minReplicas=${MIN} maxReplicas=${MAX} revisionsMode=${MODE}"

          if [[ "${MIN}" != "1" || "${MAX}" != "1" ]]; then
            echo "::error::Replica configuration is ${MIN}/${MAX}, expected 1/1."
            exit 1
          fi
          if [[ "${MODE}" != "Single" ]]; then
            echo "::error::Active revisions mode is ${MODE}, expected Single."
            exit 1
          fi

      - name: Resolve the service URL
        id: url
        run: |
          FQDN=$(az containerapp show --name "${CONTAINERAPP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "url=https://${FQDN}" >> "$GITHUB_OUTPUT"
          echo "Deployed to https://${FQDN}"

      # Installed before the deploy because both the success gate and the rollback
      # verification run the smoke test.
      - name: Install smoke-test dependencies
        working-directory: backend
        run: npm ci

      # A new revision takes a little while to pass its startup probe; poll rather than
      # sleeping a fixed amount.
      - name: Wait for readiness
        run: |
          URL="${{ steps.url.outputs.url }}"
          for attempt in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${URL}/ready" || echo "000")
            if [[ "${CODE}" == "200" ]]; then
              echo "Ready after ${attempt} attempt(s)."
              exit 0
            fi
            echo "  attempt ${attempt}: /ready returned ${CODE}"
            sleep 10
          done
          echo "::error::Service did not become ready."
          exit 1

      # The release gate: liveness, database readiness through Atlas, and a real
      # WebSocket upgrade through the Container Apps ingress.
      - name: Smoke test the deployment
        id: smoke
        working-directory: backend
        run: node scripts/smoke.mjs "${{ steps.url.outputs.url }}"

      # Every gate above passed, so this build is now the one :latest should name.
      # The image was already built and tagged locally; this pushes that tag without
      # rebuilding.
      - name: Promote :latest
        if: success()
        run: |
          docker push "${{ steps.registry.outputs.login_server }}/${IMAGE_NAME}:latest"
          echo "Promoted ${IMAGE_NAME}:latest -> ${GITHUB_SHA}"

      # Reachable only when a step above failed and a previous image exists. The image
      # is immutable in the registry, so this is a deterministic restore, not a rebuild.
      #
      # Restoring is not the same as recovering: the rollback is verified with the same
      # gates the deployment had to pass, and the workflow fails loudly if the restored
      # revision is not actually serving. Four outcomes are distinguishable in the log:
      #   DEPLOYMENT FAILED          the new image did not pass its gates
      #   ROLLBACK ATTEMPTED         the restore command was issued
      #   ROLLBACK VERIFICATION FAILED  the restore did not bring the app back
      #   ROLLBACK VERIFIED          the previous image is confirmed serving
      - name: Roll back to the previous image and verify it
        id: rollback
        if: failure() && steps.current.outputs.image != ''
        run: |
          set -uo pipefail
          PREVIOUS="${{ steps.current.outputs.image }}"
          URL="${{ steps.url.outputs.url }}"

          echo "::error::DEPLOYMENT FAILED — the new image did not pass its gates."
          echo "ROLLBACK ATTEMPTED: restoring ${PREVIOUS}"

          if ! az containerapp update \
            --name "${CONTAINERAPP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --image "${PREVIOUS}" \
            --output none; then
            echo "::error::ROLLBACK VERIFICATION FAILED — the restore command itself failed."
            echo "status=restore-command-failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # 1. The platform must report the active revision healthy.
          echo "Waiting for the restored revision to report healthy..."
          REVISION_OK=false
          for attempt in $(seq 1 30); do
            STATE=$(az containerapp revision list \
              --name "${CONTAINERAPP_NAME}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --query "[?properties.active].properties.healthState | [0]" -o tsv 2>/dev/null || echo "")
            if [[ "${STATE}" == "Healthy" ]]; then
              echo "  active revision healthy after ${attempt} attempt(s)."
              REVISION_OK=true
              break
            fi
            echo "  attempt ${attempt}: revision healthState=${STATE:-unknown}"
            sleep 10
          done

          if [[ "${REVISION_OK}" != "true" ]]; then
            echo "::error::ROLLBACK VERIFICATION FAILED — restored revision never became healthy."
            echo "status=revision-unhealthy" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # 2. Liveness must answer.
          HEALTH=000
          for attempt in $(seq 1 30); do
            HEALTH=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${URL}/health" || echo "000")
            [[ "${HEALTH}" == "200" ]] && break
            echo "  attempt ${attempt}: /health returned ${HEALTH}"
            sleep 10
          done
          if [[ "${HEALTH}" != "200" ]]; then
            echo "::error::ROLLBACK VERIFICATION FAILED — /health returned ${HEALTH}, expected 200."
            echo "status=health-failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "  /health 200"

          # 3. Readiness must answer, which also proves MongoDB Atlas is reachable.
          READY=000
          for attempt in $(seq 1 30); do
            READY=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${URL}/ready" || echo "000")
            [[ "${READY}" == "200" ]] && break
            echo "  attempt ${attempt}: /ready returned ${READY}"
            sleep 10
          done
          if [[ "${READY}" != "200" ]]; then
            echo "::error::ROLLBACK VERIFICATION FAILED — /ready returned ${READY}, expected 200."
            echo "status=ready-failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "  /ready 200"

          # 4. Read-only smoke test: same gate as the deployment, minus the write that
          # would add a throwaway user to production during an incident.
          if ! SMOKE_SKIP_WRITE=1 node backend/scripts/smoke.mjs "${URL}"; then
            echo "::error::ROLLBACK VERIFICATION FAILED — read-only smoke test failed."
            echo "status=smoke-failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "status=verified" >> "$GITHUB_OUTPUT"
          echo "ROLLBACK VERIFIED: ${PREVIOUS} is serving and healthy."
          echo "The failed image remains in the registry for inspection."
          echo "Note: :latest was not promoted, so it still names the last good build."

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### Azure Container Apps deployment"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| App | \`${CONTAINERAPP_NAME}\` |"
            echo "| Resource group | \`${AZURE_RESOURCE_GROUP}\` |"
            echo "| Region | \`${AZURE_REGION}\` |"
            echo "| Image | \`${{ steps.registry.outputs.image }}\` |"
            echo "| URL | ${{ steps.url.outputs.url }} |"
            echo "| Previous image | \`${{ steps.current.outputs.image }}\` |"
            echo "| Smoke test | ${{ steps.smoke.outcome }} |"
            echo "| Rollback | ${{ steps.rollback.outcome || 'not needed' }} (${{ steps.rollback.outputs.status || 'n/a' }}) |"
          } >> "$GITHUB_STEP_SUMMARY"
